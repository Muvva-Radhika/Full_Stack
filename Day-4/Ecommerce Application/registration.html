<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background-color: #f2f2f2;
            background-image: url("https://thumbs.dreamstime.com/z/e-commerce-ecommerce-web-banner-orange-background-various-shopping-icons-online-shopping-concept-e-commerce-ecommerce-web-246439258.jpg");
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-box {

            width: 400px;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px gray;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;

            padding: 10px;

            border: 1px solid gray;

            border-radius: 5px;
        }

        .register-btn {

            width: 100%;

            padding: 10px;

            background-color: blue;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }

        .login-link {

            text-align: center;

            margin-top: 15px;
        }

        a {
            color: blue;
        }
    </style>

</head>

<body>

    <div class="register-box">

        <h1>Create Account</h1>

        <form>

            <div class="form-group">

                <label for="name">Full Name</label>

                <input type="text" id="name" name="name" placeholder="Enter your name" required>

            </div>


            <div class="form-group">

                <label for="email">Email</label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required>

            </div>


            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Create password" required>

            </div>


            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password"
                    required>

            </div>


            <button class="register-btn" type="submit">

                Register

            </button>

        </form>


        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</body>

</html>
