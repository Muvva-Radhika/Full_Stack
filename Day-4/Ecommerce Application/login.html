<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            background-image: url("https://thumbs.dreamstime.com/z/e-commerce-ecommerce-web-banner-orange-background-various-shopping-icons-online-shopping-concept-e-commerce-ecommerce-web-246439258.jpg");
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            width: 350px;
            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 4px 15px gray;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;

            border: 1px solid gray;
            border-radius: 5px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;

            background-color: green;
            color: white;

            border: none;
            border-radius: 5px;

            cursor: pointer;
        }

        .register-link {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>


    <div class="login-box">

        <h1>Login</h1>

        <form>

            <div class="form-group">
                <label for="email">Email</label>

                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="registration.html">Register</a>
        </p>

    </div>

</body>

</html>
